<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LENLU LLM (emu) Ollama Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #34495e;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #95a5a6;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #34495e;
            color: white;
            border: 1px solid #4a6278;
        }

        .btn-secondary:hover {
            background: #4a6278;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .model-selector {
            margin-bottom: 20px;
        }

        .model-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a6278;
            background: #34495e;
            color: white;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-online {
            background: #2ecc71;
            color: white;
        }

        .status-offline {
            background: #e74c3c;
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .assistant .message-content {
            background: white;
            color: #2c3e50;
            border: 1px solid #e0e0e0;
        }

        .code-block {
            background: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            position: relative;
            margin: 8px 0;
        }

        .code-copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .code-block:hover .code-copy-btn {
            opacity: 1;
        }

        .code-copy-btn:hover {
            background: #764ba2;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #95a5a6;
        }

        .spinner {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .spinner:nth-child(1) { animation-delay: 0s; }
        .spinner:nth-child(2) { animation-delay: 0.2s; }
        .spinner:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-area {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .stats-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .stats-label {
            font-size: 12px;
            color: #95a5a6;
            text-transform: uppercase;
        }

        .stats-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .error-message {
            padding: 12px 16px;
            background: #ffe5e5;
            color: #c0392b;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .terminal-output {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-tab {
            padding: 10px 15px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .terminal-tab.active {
            border-bottom-color: #667eea;
            background: white;
        }

        .terminal-tab:hover {
            background: #e8e8e8;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
            }

            .message-content {
                max-width: 90%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">📱 LENLU LLM (emu)</div>
            
            <div class="section">
                <div class="section-title">Model Selection</div>
                <div class="model-selector">
                    <select id="modelSelect" class="model-select">
                        <option value="lenlu">LENLU (Default)</option>
                    </select>
                </div>
                <div id="status" class="status-badge status-offline">Offline</div>
            </div>

            <div class="section">
                <div class="section-title">Actions</div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="newSession()">New Session</button>
                    <button class="btn btn-secondary" onclick="loadHistory()">View History</button>
                    <button class="btn btn-secondary" onclick="exportChat()">Export Chat JSON</button>
                    <button class="btn btn-secondary" onclick="exportPDF()">📄 Export PDF</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Statistics</div>
                <div class="stats-card">
                    <div class="stats-label">Total Chats</div>
                    <div class="stats-value" id="totalChats">0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">Active Sessions</div>
                    <div class="stats-value" id="activeSessions">0</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Danger Zone</div>
                <div class="button-group">
                    <button class="btn btn-danger" onclick="clearHistory()">Clear History</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="header-title">LENLU LLM (emu) Chat</div>
                <button class="btn btn-secondary" onclick="refreshStatus()" style="font-size: 12px;">🔄 Refresh Status</button>
            </div>

            <div class="chat-area" id="chatArea">
                <div style="text-align: center; color: #95a5a6; padding: 40px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">💬</div>
                    <div style="font-size: 18px;">Welcome to LENLU LLM (emu)</div>
                    <div style="font-size: 14px; margin-top: 10px;">Start typing to chat with Ollama</div>
                </div>
            </div>

            <div class="input-area" id="inputArea">
                <div class="input-wrapper">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button class="send-btn" onclick="document.getElementById('imageInput').click()" title="Upload image" style="padding: 12px 12px; width: auto;">📷</button>
                    <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-title">Conversation History</div>
            <div id="historyContent" style="max-height: 400px; overflow-y: auto;"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('historyModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = generateSessionId();
        let currentModel = 'lenlu';

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const statusBadge = document.getElementById('status');
                if (data.ollama_running) {
                    statusBadge.textContent = '🟢 Online';
                    statusBadge.className = 'status-badge status-online';
                } else {
                    statusBadge.textContent = '🔴 Offline';
                    statusBadge.className = 'status-badge status-offline';
                }

                const modelSelect = document.getElementById('modelSelect');
                if (data.models.length > 0) {
                    modelSelect.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        modelSelect.appendChild(option);
                    });
                    currentModel = data.models[0];
                }

                updateStats();
            } catch (error) {
                console.error('Status check failed:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            const loadingId = 'loading_' + Date.now();
            addMessage('⏳ Thinking...', 'assistant', loadingId);

            try {
                currentModel = document.getElementById('modelSelect').value;
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        model: currentModel,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    addMessage(data.response, 'assistant');
                    updateStats();
                } else {
                    addMessage('❌ Error: ' + (data.error || 'No response'), 'assistant');
                }
            } catch (error) {
                removeMessage(loadingId);
                addMessage('❌ Error: ' + error.message, 'assistant');
            }
        }

        function addMessage(content, sender, id = null) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (id) messageDiv.id = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = escapeHtml(content);

            messageDiv.appendChild(contentDiv);

            if (chatArea.querySelector('div[style*="text-align"]')) {
                chatArea.innerHTML = '';
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeMessage(id) {
            const msg = document.getElementById(id);
            if (msg) msg.remove();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/summary');
                const data = await response.json();
                document.getElementById('totalChats').textContent = data.total_chats;
                document.getElementById('activeSessions').textContent = data.unique_sessions;
            } catch (error) {
                console.error('Stats update failed:', error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();

                let content = '';
                if (history.length === 0) {
                    content = '<p style="color: #95a5a6;">No conversations yet</p>';
                } else {
                    history.forEach((chat, index) => {
                        content += `
                            <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0;">
                                <strong>[${chat.model}]</strong> ${new Date(chat.timestamp).toLocaleString()}<br>
                                <span style="color: #667eea;">Q:</span> ${escapeHtml(chat.user.substring(0, 80))}<br>
                                <span style="color: #764ba2;">A:</span> ${escapeHtml(chat.assistant.substring(0, 80))}...
                            </div>
                        `;
                    });
                }

                document.getElementById('historyContent').innerHTML = content;
                document.getElementById('historyModal').classList.add('active');
            } catch (error) {
                alert('❌ Error loading history');
            }
        }

        async function exportChat() {
            try {
                const response = await fetch('/api/export');
                const data = await response.json();
                alert('✅ Chat exported! File: ' + data.filename);
            } catch (error) {
                alert('❌ Error exporting chat');
            }
        }

        async function exportPDF() {
            try {
                const response = await fetch('/api/export-pdf');
                const data = await response.json();
                if (response.ok) {
                    alert('✅ PDF exported!');
                    window.open(data.path, '_blank');
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                alert('❌ Error exporting PDF');
            }
        }

        function clearHistory() {
            if (confirm('Are you sure? This cannot be undone.')) {
                fetch('/api/clear-history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirm: true })
                }).then(() => {
                    alert('✅ History cleared!');
                    location.reload();
                }).catch(() => alert('❌ Error clearing history'));
            }
        }

        function newSession() {
            sessionId = generateSessionId();
            document.getElementById('chatArea').innerHTML = `
                <div style="text-align: center; color: #95a5a6; padding: 40px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">✨</div>
                    <div style="font-size: 18px;">New Session Started</div>
                </div>
            `;
        }

        function refreshStatus() {
            checkStatus();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        document.getElementById('messageInput')?.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        document.getElementById('messageInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        checkStatus();
        setInterval(checkStatus, 30000);

        document.getElementById('imageInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    addMessage('📸 Image uploaded', 'user');
                    addMessage('📸 Image received', 'assistant');
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
