<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LENLU LLM (emu) Ollama Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #34495e;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #95a5a6;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #34495e;
            color: white;
            border: 1px solid #4a6278;
        }

        .btn-secondary:hover {
            background: #4a6278;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .model-selector {
            margin-bottom: 20px;
        }

        .model-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a6278;
            background: #34495e;
            color: white;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-online {
            background: #2ecc71;
            color: white;
        }

        .status-offline {
            background: #e74c3c;
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .assistant .message-content {
            background: white;
            color: #2c3e50;
            border: 1px solid #e0e0e0;
        }

        .code-block {
            background: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            position: relative;
            margin: 8px 0;
        }

        .code-copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .code-block:hover .code-copy-btn {
            opacity: 1;
        }

        .code-copy-btn:hover {
            background: #764ba2;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #95a5a6;
        }

        .spinner {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .spinner:nth-child(1) { animation-delay: 0s; }
        .spinner:nth-child(2) { animation-delay: 0.2s; }
        .spinner:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-area {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .stats-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .stats-label {
            font-size: 12px;
            color: #95a5a6;
            text-transform: uppercase;
        }

        .stats-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .error-message {
            padding: 12px 16px;
            background: #ffe5e5;
            color: #c0392b;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .terminal-output {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-output .error {
            color: #ff4444;
        }

        .terminal-output .warning {
            color: #ffaa00;
        }

        .terminal-output .success {
            color: #00ff00;
        }

        .terminal-tab {
            padding: 10px 15px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .terminal-tab.active {
            border-bottom-color: #667eea;
            background: white;
        }

        .terminal-tab:hover {
            background: #e8e8e8;
        }

        .terminal-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
                display: none;
            }

            .sidebar.active {
                display: block;
            }

            .message-content {
                max-width: 90%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">📱 LENLU LLM (emu)</div>
            
            <div class="section">
                <div class="section-title">Model Selection</div>
                <div class="model-selector">
                    <select id="modelSelect" class="model-select">
                        <option value="lenlu">LENLU (Default)</option>
                    </select>
                </div>
                <div id="status" class="status-badge status-offline">Offline</div>
            </div>

            <div class="section">
                <div class="section-title">Actions</div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="newSession()">New Session</button>
                    <button class="btn btn-secondary" onclick="loadHistory()">View History</button>
                    <button class="btn btn-secondary" onclick="exportChat()">Export Chat</button>
                    <button class="btn btn-secondary" onclick="exportPDF()">📄 Export PDF</button>
                    <button class="btn btn-secondary" onclick="toggleTerminal()">Terminal</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Statistics</div>
                <div class="stats-card">
                    <div class="stats-label">Total Chats</div>
                    <div class="stats-value" id="totalChats">0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">Active Sessions</div>
                    <div class="stats-value" id="activeSessions">0</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Danger Zone</div>
                <div class="button-group">
                    <button class="btn btn-danger" onclick="clearHistory()">Clear All History</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="header-title">LENLU LLM (emu) Ollama Chat</div>
                <div style="display: flex; gap: 10px;">
                    <button class="terminal-tab active" onclick="switchTab('chat')" id="chatTab">💬 Chat</button>
                    <button class="terminal-tab" onclick="switchTab('terminal')" id="terminalTab">⌨️ Terminal</button>
                    <button class="btn btn-secondary" onclick="refreshStatus()" style="font-size: 12px;">Refresh</button>
                </div>
            </div>

            <div class="chat-area" id="chatArea">
                <div style="text-align: center; color: #95a5a6; padding: 40px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">💬</div>
                    <div style="font-size: 18px;">Welcome to LENLU LLM (emu)</div>
                    <div style="font-size: 14px; margin-top: 10px;">Start a conversation by typing your message below</div>
                </div>
            </div>

            <div class="chat-area" id="terminalArea" style="display: none; background: #1e1e1e;">
                <div style="padding: 20px; height: 100%; overflow-y: auto;">
                    <div style="margin-bottom: 15px;">
                        <label style="color: white; font-weight: 600; display: block; margin-bottom: 10px;">Command:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="terminalCommand" placeholder="Enter command or select from below..." 
                                   style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white;">
                            <button onclick="executeCommand()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">
                                Execute
                            </button>
                        </div>
                        <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;">
                            <button onclick="runCommand('python ollama_chat_interface.py')" style="padding: 5px 10px; background: #764ba2; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">Chat Interface</button>
                            <button onclick="runCommand('python terminal_interface.py')" style="padding: 5px 10px; background: #764ba2; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">Terminal UI</button>
                            <button onclick="runCommand('python launcher.py')" style="padding: 5px 10px; background: #764ba2; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">Launcher</button>
                            <button onclick="runCommand('git status')" style="padding: 5px 10px; background: #764ba2; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">Git Status</button>
                        </div>
                    </div>

                    <div>
                        <label style="color: white; font-weight: 600; display: block; margin-bottom: 10px;">Output:</label>
                        <div class="terminal-output" id="terminalOutput">
                            <span style="color: #667eea;">>> Ready to execute commands...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area" id="inputArea">
                <div class="input-wrapper">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button class="send-btn" onclick="document.getElementById('imageInput').click()" title="Upload image" style="padding: 12px 12px; width: auto;">📷</button>
                    <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-title">Conversation History</div>
            <div id="historyContent" style="max-height: 400px; overflow-y: auto;"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('historyModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = generateSessionId();
        let currentModel = 'lenlu';

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const statusBadge = document.getElementById('status');
                if (data.ollama_running) {
                    statusBadge.textContent = 'Online';
                    statusBadge.className = 'status-badge status-online';
                } else {
                    statusBadge.textContent = 'Offline';
                    statusBadge.className = 'status-badge status-offline';
                }

                // Populate model selector
                const modelSelect = document.getElementById('modelSelect');
                if (data.models.length > 0) {
                    modelSelect.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        if (model === 'lenlu') option.selected = true;
                        modelSelect.appendChild(option);
                    });
                    currentModel = data.models[0];
                }

                updateStats();
            } catch (error) {
                console.error('Status check failed:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Show loading
            const loadingId = 'loading_' + Date.now();
            addMessage('<div class="spinner"></div><div class="spinner"></div><div class="spinner"></div> Thinking...', 'assistant', loadingId);

            try {
                currentModel = document.getElementById('modelSelect').value;
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        model: currentModel,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    addMessage(data.response, 'assistant');
                    updateStats();
                } else {
                    addMessage(data.error || 'Error: No response', 'assistant');
                }
            } catch (error) {
                removeMessage(loadingId);
                addMessage('Error: ' + error.message, 'assistant');
            }
        }

        function addMessage(content, sender, id = null) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (id) messageDiv.id = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content;

            messageDiv.appendChild(contentDiv);

            if (chatArea.querySelector('div[style*="text-align"]')) {
                chatArea.innerHTML = '';
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeMessage(id) {
            const msg = document.getElementById(id);
            if (msg) msg.remove();
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/summary');
                const data = await response.json();
                document.getElementById('totalChats').textContent = data.total_chats;
                document.getElementById('activeSessions').textContent = data.unique_sessions;
            } catch (error) {
                console.error('Stats update failed:', error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();

                let content = '';
                if (history.length === 0) {
                    content = '<p style="color: #95a5a6;">No conversations yet</p>';
                } else {
                    content = '<div style="max-height: 400px; overflow-y: auto;">';
                    history.forEach((chat, index) => {
                        content += `
                            <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0;">
                                <strong>[${chat.model}] ${chat.timestamp}</strong><br>
                                <span style="color: #667eea;">Q:</span> ${chat.user.substring(0, 60)}...<br>
                                <span style="color: #764ba2;">A:</span> ${chat.assistant.substring(0, 60)}...
                            </div>
                        `;
                    });
                    content += '</div>';
                }

                document.getElementById('historyContent').innerHTML = content;
                document.getElementById('historyModal').classList.add('active');
            } catch (error) {
                alert('Error loading history: ' + error);
            }
        }

        async function exportChat() {
            try {
                const response = await fetch('/api/export');
                const data = await response.json();
                alert('Chat exported to: ' + data.path);
            } catch (error) {
                alert('Error exporting: ' + error);
            }
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all chat history? This cannot be undone.')) {
                fetch('/api/clear-history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirm: true })
                }).then(() => {
                    alert('History cleared!');
                    location.reload();
                });
            }
        }

        function newSession() {
            sessionId = generateSessionId();
            document.getElementById('chatArea').innerHTML = `
                <div style="text-align: center; color: #95a5a6; padding: 40px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">✨</div>
                    <div style="font-size: 18px;">New Session Started</div>
                </div>
            `;
            alert('New session created!');
        }

        function refreshStatus() {
            checkStatus();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Auto-resize textarea
        document.getElementById('messageInput')?.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send on Enter
        document.getElementById('messageInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        checkStatus();
        setInterval(checkStatus, 30000);

        // Tab switching
        function switchTab(tab) {
            const chatArea = document.getElementById('chatArea');
            const terminalArea = document.getElementById('terminalArea');
            const inputArea = document.getElementById('inputArea');
            const chatTab = document.getElementById('chatTab');
            const terminalTab = document.getElementById('terminalTab');

            if (tab === 'chat') {
                chatArea.style.display = 'flex';
                terminalArea.style.display = 'none';
                inputArea.style.display = 'flex';
                chatTab.classList.add('active');
                terminalTab.classList.remove('active');
            } else {
                chatArea.style.display = 'none';
                terminalArea.style.display = 'block';
                inputArea.style.display = 'none';
                chatTab.classList.remove('active');
                terminalTab.classList.add('active');
            }
        }

        function toggleTerminal() {
            const tab = document.getElementById('chatArea').style.display !== 'none' ? 'terminal' : 'chat';
            switchTab(tab);
        }

        function runCommand(cmd) {
            document.getElementById('terminalCommand').value = cmd;
            executeCommand();
        }

        function executeCommand() {
            const command = document.getElementById('terminalCommand').value.trim();
            if (!command) return;

            const output = document.getElementById('terminalOutput');
            output.innerHTML = '<span style="color: #667eea;">>> Executing: ' + command + '</span>\n<span style="color: #888;">>> Please wait...\n\n</span>';

            fetch('/api/terminal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command })
            })
            .then(r => r.json())
            .then(data => {
                let result = '<span style="color: #667eea;">>> ' + command + '</span>\n\n';
                
                if (data.stdout) {
                    result += '<span style="color: #00ff00;">' + escapeHtml(data.stdout) + '</span>';
                }
                
                if (data.stderr) {
                    result += '\n<span style="color: #ff4444;">' + escapeHtml(data.stderr) + '</span>';
                }
                
                if (data.returncode !== 0) {
                    result += '\n<span style="color: #ffaa00;">>>> Exit code: ' + data.returncode + '</span>';
                } else {
                    result += '\n<span style="color: #00ff00;">>>> Success!</span>';
                }
                
                output.innerHTML = result;
                output.scrollTop = output.scrollHeight;
            })
            .catch(err => {
                output.innerHTML += '\n<span style="color: #ff4444;">Error: ' + err.message + '</span>';
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Image upload
        document.getElementById('imageInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageData = event.target.result;
                    addMessage(`<img src="${imageData}" style="max-width: 300px; border-radius: 8px;">`, 'user');
                    addMessage('📸 Image received - Processing...', 'assistant');
                    // TODO: Send to API for processing
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });

        async function exportPDF() {
            try {
                const response = await fetch('/api/export-pdf');
                const data = await response.json();
                if (response.ok) {
                    alert('PDF exported successfully to: ' + data.path);
                    // Optional: Download the file
                    window.open(data.path, '_blank');
                } else {
                    alert('Error exporting PDF: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error exporting PDF: ' + error);
            }
        }

        // Enhanced message rendering with code highlighting
        function createCodeBlock(code, language = 'text') {
            const escaped = escapeHtml(code);
            return `
                <div class="code-block" style="position: relative;">
                    <button class="code-copy-btn" onclick="copyCode(this)">Copy</button>
                    <pre>${escaped}</pre>
                </div>
            `;
        }

        function copyCode(button) {
            const codeBlock = button.parentElement;
            const code = codeBlock.innerText.replace('Copy', '').trim();
            navigator.clipboard.writeText(code).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                alert('Failed to copy code');
            });
        }

        // Parse and highlight code blocks in responses
        function parseCodeBlocks(text) {
            // Find code blocks marked with ```
            const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let html = escapeHtml(text);
            
            html = html.replace(codeBlockRegex, (match, language, code) => {
                const lang = language || 'text';
                const escaped = code.trim();
                return `<div class="code-block" style="position: relative;"><button class="code-copy-btn" onclick="copyCode(this)">Copy</button><pre>${escaped}</pre></div>`;
            });
            
            return html;
        }

        // Override addMessage to use the enhanced version
        const originalAddMessage = addMessage;
        function addMessage(content, sender, id = null) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (id) messageDiv.id = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Parse code blocks for assistant messages
            if (sender === 'assistant' && !content.includes('<div class="spinner">')) {
                contentDiv.innerHTML = parseCodeBlocks(content);
            } else {
                contentDiv.innerHTML = content;
            }

            messageDiv.appendChild(contentDiv);

            if (chatArea.querySelector('div[style*="text-align"]')) {
                chatArea.innerHTML = '';
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    </script>
</body>
</html>
